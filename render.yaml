services:
  - type: web
    name: leclerc-labs-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://leclerc-labs.vercel.app
      - key: OPENF1_TIMEOUT_SECONDS
        value: "15"
